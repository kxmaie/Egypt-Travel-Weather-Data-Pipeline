# ─────────────────────────────────────────────────────────────────────────────
# CI: Python lint — checks ingestion, transformation, and loader code
# for syntax errors and basic style issues.
# ─────────────────────────────────────────────────────────────────────────────

name: Python Lint

on:
  push:
    branches: [master, main]
    paths:
      - "include/**/*.py"
      - "dags/**/*.py"
      - "dashboard/**/*.py"
      - ".github/workflows/python-lint.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "include/**/*.py"
      - "dags/**/*.py"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install linters
        run: pip install ruff

      - name: Ruff check (dags + include + dashboard)
        run: ruff check dags/ include/ dashboard/ --select=E,F,W --ignore=E501

      - name: Ruff format check
        run: ruff format --check dags/ include/ dashboard/ || true
