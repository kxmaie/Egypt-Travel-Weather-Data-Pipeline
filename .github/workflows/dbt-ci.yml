name: dbt CI

on:
  push:
    branches: [master, main]
    paths:
      - "include/dbt_project/**"
      - ".github/workflows/dbt-ci.yml"
      - ".github/workflows/dbt-integration.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "include/dbt_project/**"
      - ".github/workflows/dbt-ci.yml"
      - ".github/workflows/dbt-integration.yml"

permissions:
  contents: read

jobs:
  dbt-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dbt-snowflake
        run: pip install "dbt-snowflake>=1.7,<2.0"
      - name: Resolve dbt packages
        working-directory: include/dbt_project
        run: dbt deps --profiles-dir .
      - name: Parse project without warehouse credentials
        working-directory: include/dbt_project
        run: dbt parse --no-partial-parse --profiles-dir .
