version: 2
sources:
  - name: raw_data
    database: "{{ env_var('SNOWFLAKE_SOURCE_DATABASE', 'RENTAL_WEATHER_DB') }}"
    schema: RAW_DATA
    tables:
      # FIX #1: أسماء الجداول محدّثة لتعكس المستوى الحقيقي للبيانات (Silver/Bronze)
      - name: Silver_famous_landmark_data
        description: "Silver-level famous landmark data loaded from SQL Server Silver layer"
        identifier: '"Silver_famous_landmark_data"'
      - name: Bronze_hotel_data
        description: "Bronze-level hotel data loaded directly from CSV snapshot"
        identifier: '"Bronze_hotel_data"'
      - name: Bronze_restaurant_data
        description: "Bronze-level restaurant data loaded directly from CSV snapshot"
        identifier: '"Bronze_restaurant_data"'
      - name: Silver_current_weather_data
        description: "Silver-level current weather data — one row per city"
        identifier: '"Silver_current_weather_data"'
      - name: Silver_daily_weather_data
        description: "Silver-level daily weather forecast data"
        identifier: '"Silver_daily_weather_data"'
      - name: Silver_hourly_weather_data
        description: "Silver-level hourly weather data"
        identifier: '"Silver_hourly_weather_data"'
