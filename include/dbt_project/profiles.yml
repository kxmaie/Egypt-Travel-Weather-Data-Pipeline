dbt_project:
  outputs:
    dev:
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'RO04574.eu-central-2.aws') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'WEATHER_DB') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'WEATHER_PROJECT_ROLE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA', 'RAW_DATA') }}"
      threads: 1
      type: snowflake
      user: "{{ env_var('SNOWFLAKE_USER', 'AIRFLOW_USER') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'WEATHER_WH') }}"
  target: dev
