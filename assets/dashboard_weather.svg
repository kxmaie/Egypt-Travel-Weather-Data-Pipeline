<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="#F5F7FA" rx="8"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="60" height="600" fill="#1A1F2E"/>
  <text x="30" y="40" text-anchor="middle" font-size="20" fill="#FFD700">🏜️</text>
  <circle cx="30" cy="80" r="16" fill="#2A3045"/>
  <text x="30" y="85" text-anchor="middle" font-size="14" fill="#8895A5">📊</text>
  <circle cx="30" cy="120" r="16" fill="#2A3045"/>
  <text x="30" y="125" text-anchor="middle" font-size="14" fill="#8895A5">🏨</text>
  <circle cx="30" cy="160" r="16" fill="#0868E0" filter="url(#shadow3)"/>
  <text x="30" y="165" text-anchor="middle" font-size="14" fill="#FFF">🌡️</text>
  <circle cx="30" cy="200" r="16" fill="#2A3045"/>
  <text x="30" y="205" text-anchor="middle" font-size="14" fill="#8895A5">🍽️</text>

  <!-- Header -->
  <text x="80" y="35" font-size="18" font-weight="700" fill="#18212B">🌡️ Weather Dashboard</text>
  <text x="80" y="52" font-size="11" fill="#8895A5">Current conditions and daily forecasts for Egyptian cities</text>

  <!-- KPIs -->
  <rect x="80" y="65" width="210" height="70" rx="8" fill="#FFF" filter="url(#shadow3)"/>
  <text x="100" y="88" font-size="11" fill="#8895A5">Cities</text>
  <text x="100" y="118" font-size="28" font-weight="700" fill="#0868E0">8</text>

  <rect x="305" y="65" width="210" height="70" rx="8" fill="#FFF" filter="url(#shadow3)"/>
  <text x="325" y="88" font-size="11" fill="#8895A5">Hottest City</text>
  <text x="325" y="118" font-size="22" font-weight="700" fill="#E74C3C">Luxor</text>
  <text x="430" y="118" font-size="14" fill="#E74C3C">36.5°C</text>

  <rect x="530" y="65" width="210" height="70" rx="8" fill="#FFF" filter="url(#shadow3)"/>
  <text x="550" y="88" font-size="11" fill="#8895A5">Coldest City</text>
  <text x="550" y="118" font-size="22" font-weight="700" fill="#3498DB">Alexandria</text>
  <text x="665" y="118" font-size="14" fill="#3498DB">22.1°C</text>

  <rect x="755" y="65" width="200" height="70" rx="8" fill="#FFF" filter="url(#shadow3)"/>
  <text x="775" y="88" font-size="11" fill="#8895A5">Avg Humidity</text>
  <text x="775" y="118" font-size="28" font-weight="700" fill="#2ECC71">54%</text>

  <!-- Current Temperature Bar Chart -->
  <rect x="80" y="155" width="430" height="230" rx="8" fill="#FFF" filter="url(#shadow3)"/>
  <text x="100" y="180" font-size="13" font-weight="600" fill="#18212B">Current Temperature by City (°C)</text>

  <!-- Y axis -->
  <line x1="100" y1="200" x2="100" y2="360" stroke="#D0D8E0" stroke-width="1"/>
  <text x="92" y="205" text-anchor="end" font-size="8" fill="#8895A5">40</text>
  <text x="92" y="245" text-anchor="end" font-size="8" fill="#8895A5">35</text>
  <text x="92" y="285" text-anchor="end" font-size="8" fill="#8895A5">30</text>
  <text x="92" y="325" text-anchor="end" font-size="8" fill="#8895A5">25</text>
  <text x="92" y="360" text-anchor="end" font-size="8" fill="#8895A5">20</text>

  <!-- Bars -->
  <rect x="115" y="230" width="40" height="130" rx="3" fill="#E74C3C"/>
  <text x="135" y="225" text-anchor="middle" font-size="9" font-weight="600" fill="#E74C3C">36.5</text>
  <text x="135" y="375" text-anchor="middle" font-size="9" fill="#5A6B7A">Luxor</text>

  <rect x="165" y="245" width="40" height="115" rx="3" fill="#E67E22"/>
  <text x="185" y="240" text-anchor="middle" font-size="9" font-weight="600" fill="#E67E22">34.2</text>
  <text x="185" y="375" text-anchor="middle" font-size="9" fill="#5A6B7A">Aswan</text>

  <rect x="215" y="270" width="40" height="90" rx="3" fill="#F39C12"/>
  <text x="235" y="265" text-anchor="middle" font-size="9" font-weight="600" fill="#F39C12">31.0</text>
  <text x="235" y="375" text-anchor="middle" font-size="9" fill="#5A6B7A">Marsa Alam</text>

  <rect x="265" y="280" width="40" height="80" rx="3" fill="#F1C40F"/>
  <text x="285" y="275" text-anchor="middle" font-size="9" font-weight="600" fill="#F1C40F">29.5</text>
  <text x="285" y="375" text-anchor="middle" font-size="9" fill="#5A6B7A">Sharm</text>

  <rect x="315" y="290" width="40" height="70" rx="3" fill="#2ECC71"/>
  <text x="335" y="285" text-anchor="middle" font-size="9" font-weight="600" fill="#2ECC71">28.0</text>
  <text x="335" y="375" text-anchor="middle" font-size="9" fill="#5A6B7A">Hurghada</text>

  <rect x="365" y="310" width="40" height="50" rx="3" fill="#3498DB"/>
  <text x="385" y="305" text-anchor="middle" font-size="9" font-weight="600" fill="#3498DB">25.5</text>
  <text x="385" y="375" text-anchor="middle" font-size="9" fill="#5A6B7A">Cairo</text>

  <rect x="415" y="315" width="40" height="45" rx="3" fill="#2980B9"/>
  <text x="435" y="310" text-anchor="middle" font-size="9" font-weight="600" fill="#2980B9">25.0</text>
  <text x="435" y="375" text-anchor="middle" font-size="9" fill="#5A6B7A">Giza</text>

  <rect x="465" y="335" width="40" height="25" rx="3" fill="#1ABC9C"/>
  <text x="485" y="330" text-anchor="middle" font-size="9" font-weight="600" fill="#1ABC9C">22.1</text>
  <text x="485" y="375" text-anchor="middle" font-size="9" fill="#5A6B7A">Alex</text>

  <!-- Humidity & Wind Chart -->
  <rect x="525" y="155" width="430" height="230" rx="8" fill="#FFF" filter="url(#shadow3)"/>
  <text x="545" y="180" font-size="13" font-weight="600" fill="#18212B">Humidity &amp; Wind by City</text>

  <!-- Legend -->
  <rect x="545" y="190" width="10" height="10" rx="2" fill="#2ECC71"/>
  <text x="560" y="200" font-size="9" fill="#8895A5">Humidity (%)</text>
  <rect x="640" y="190" width="10" height="10" rx="2" fill="#E74C3C"/>
  <text x="655" y="200" font-size="9" fill="#8895A5">Wind (km/h)</text>

  <!-- Group bars -->
  <rect x="555" y="220" width="18" height="90" rx="2" fill="#2ECC71" opacity="0.8"/>
  <rect x="575" y="270" width="18" height="40" rx="2" fill="#E74C3C" opacity="0.8"/>
  <text x="575" y="325" text-anchor="middle" font-size="8" fill="#5A6B7A">Cairo</text>

  <rect x="610" y="230" width="18" height="80" rx="2" fill="#2ECC71" opacity="0.8"/>
  <rect x="630" y="280" width="18" height="30" rx="2" fill="#E74C3C" opacity="0.8"/>
  <text x="630" y="325" text-anchor="middle" font-size="8" fill="#5A6B7A">Giza</text>

  <rect x="665" y="215" width="18" height="95" rx="2" fill="#2ECC71" opacity="0.8"/>
  <rect x="685" y="260" width="18" height="50" rx="2" fill="#E74C3C" opacity="0.8"/>
  <text x="685" y="325" text-anchor="middle" font-size="8" fill="#5A6B7A">Alex</text>

  <rect x="720" y="250" width="18" height="60" rx="2" fill="#2ECC71" opacity="0.8"/>
  <rect x="740" y="240" width="18" height="70" rx="2" fill="#E74C3C" opacity="0.8"/>
  <text x="740" y="325" text-anchor="middle" font-size="8" fill="#5A6B7A">Luxor</text>

  <rect x="775" y="240" width="18" height="70" rx="2" fill="#2ECC71" opacity="0.8"/>
  <rect x="795" y="225" width="18" height="85" rx="2" fill="#E74C3C" opacity="0.8"/>
  <text x="795" y="325" text-anchor="middle" font-size="8" fill="#5A6B7A">Sharm</text>

  <rect x="830" y="255" width="18" height="55" rx="2" fill="#2ECC71" opacity="0.8"/>
  <rect x="850" y="250" width="18" height="60" rx="2" fill="#E74C3C" opacity="0.8"/>
  <text x="850" y="325" text-anchor="middle" font-size="8" fill="#5A6B7A">Hurg.</text>

  <rect x="885" y="260" width="18" height="50" rx="2" fill="#2ECC71" opacity="0.8"/>
  <rect x="905" y="230" width="18" height="80" rx="2" fill="#E74C3C" opacity="0.8"/>
  <text x="905" y="325" text-anchor="middle" font-size="8" fill="#5A6B7A">Aswan</text>

  <!-- Forecast line chart -->
  <rect x="80" y="400" width="875" height="180" rx="8" fill="#FFF" filter="url(#shadow3)"/>
  <text x="100" y="425" font-size="13" font-weight="600" fill="#18212B">📅 Temperature Forecast — Cairo</text>

  <!-- Select box mock -->
  <rect x="700" y="412" width="120" height="24" rx="6" fill="#F5F7FA" stroke="#D0D8E0" stroke-width="1"/>
  <text x="710" y="428" font-size="10" fill="#5A6B7A">Select City ▾ Cairo</text>

  <!-- Axes -->
  <line x1="100" y1="560" x2="930" y2="560" stroke="#D0D8E0" stroke-width="1"/>
  <line x1="100" y1="440" x2="100" y2="560" stroke="#D0D8E0" stroke-width="1"/>

  <!-- Grid -->
  <line x1="100" y1="470" x2="930" y2="470" stroke="#EBF0F5" stroke-width="1"/>
  <line x1="100" y1="500" x2="930" y2="500" stroke="#EBF0F5" stroke-width="1"/>
  <line x1="100" y1="530" x2="930" y2="530" stroke="#EBF0F5" stroke-width="1"/>

  <!-- Max temp line (red) -->
  <polyline points="120,460 220,465 320,470 420,455 520,450 620,455 720,465 820,470 920,475"
    fill="none" stroke="#E74C3C" stroke-width="2.5"/>
  <circle cx="120" cy="460" r="4" fill="#E74C3C"/>
  <circle cx="220" cy="465" r="4" fill="#E74C3C"/>
  <circle cx="320" cy="470" r="4" fill="#E74C3C"/>
  <circle cx="420" cy="455" r="4" fill="#E74C3C"/>
  <circle cx="520" cy="450" r="4" fill="#E74C3C"/>
  <circle cx="620" cy="455" r="4" fill="#E74C3C"/>
  <circle cx="720" cy="465" r="4" fill="#E74C3C"/>
  <circle cx="820" cy="470" r="4" fill="#E74C3C"/>
  <circle cx="920" cy="475" r="4" fill="#E74C3C"/>

  <!-- Min temp line (blue) -->
  <polyline points="120,520 220,525 320,530 420,515 520,510 620,515 720,525 820,530 920,535"
    fill="none" stroke="#3498DB" stroke-width="2.5"/>
  <circle cx="120" cy="520" r="4" fill="#3498DB"/>
  <circle cx="220" cy="525" r="4" fill="#3498DB"/>
  <circle cx="320" cy="530" r="4" fill="#3498DB"/>
  <circle cx="420" cy="515" r="4" fill="#3498DB"/>
  <circle cx="520" cy="510" r="4" fill="#3498DB"/>
  <circle cx="620" cy="515" r="4" fill="#3498DB"/>
  <circle cx="720" cy="525" r="4" fill="#3498DB"/>
  <circle cx="820" cy="530" r="4" fill="#3498DB"/>
  <circle cx="920" cy="535" r="4" fill="#3498DB"/>

  <!-- Legend -->
  <rect x="830" y="430" width="12" height="3" rx="1" fill="#E74C3C"/>
  <text x="848" y="436" font-size="9" fill="#5A6B7A">Max Temp (°C)</text>
  <rect x="830" y="445" width="12" height="3" rx="1" fill="#3498DB"/>
  <text x="848" y="451" font-size="9" fill="#5A6B7A">Min Temp (°C)</text>

  <!-- X labels -->
  <text x="120" y="575" text-anchor="middle" font-size="8" fill="#8895A5">Oct 27</text>
  <text x="320" y="575" text-anchor="middle" font-size="8" fill="#8895A5">Oct 29</text>
  <text x="520" y="575" text-anchor="middle" font-size="8" fill="#8895A5">Oct 31</text>
  <text x="720" y="575" text-anchor="middle" font-size="8" fill="#8895A5">Nov 2</text>
  <text x="920" y="575" text-anchor="middle" font-size="8" fill="#8895A5">Nov 4</text>
</svg>