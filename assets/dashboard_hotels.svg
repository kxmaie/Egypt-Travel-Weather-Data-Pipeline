<svg viewBox="0 0 1000 600" width="1000" height="600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000015"/>
    </filter>
  </defs>

  <rect width="1000" height="600" fill="#F5F7FA" rx="8"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="60" height="600" fill="#1A1F2E"/>
  <text x="30" y="40" text-anchor="middle" font-size="20" fill="#FFD700">🏜️</text>
  <circle cx="30" cy="80" r="16" fill="#2A3045"/>
  <text x="30" y="85" text-anchor="middle" font-size="14" fill="#8895A5">📊</text>
  <circle cx="30" cy="120" r="16" fill="#0868E0" filter="url(#shadow2)"/>
  <text x="30" y="125" text-anchor="middle" font-size="14" fill="#FFF">🏨</text>
  <circle cx="30" cy="160" r="16" fill="#2A3045"/>
  <text x="30" y="165" text-anchor="middle" font-size="14" fill="#8895A5">🌡️</text>
  <circle cx="30" cy="200" r="16" fill="#2A3045"/>
  <text x="30" y="205" text-anchor="middle" font-size="14" fill="#8895A5">🍽️</text>

  <!-- Header -->
  <text x="80" y="35" font-size="18" font-weight="700" fill="#18212B">🏨 Hotel Analysis</text>
  <text x="80" y="52" font-size="11" fill="#8895A5">Price tiers, value-for-money scores, and weather context per hotel</text>

  <!-- Filters -->
  <rect x="80" y="62" width="180" height="28" rx="6" fill="#FFF" stroke="#D0D8E0" stroke-width="1"/>
  <text x="90" y="80" font-size="10" fill="#8895A5">Filter by City ▾</text>
  <rect x="275" y="62" width="160" height="28" rx="6" fill="#FFF" stroke="#D0D8E0" stroke-width="1"/>
  <text x="285" y="80" font-size="10" fill="#8895A5">Price Tier ▾</text>

  <!-- KPIs -->
  <rect x="80" y="100" width="210" height="70" rx="8" fill="#FFF" filter="url(#shadow2)"/>
  <text x="100" y="123" font-size="11" fill="#8895A5">Hotels</text>
  <text x="100" y="153" font-size="28" font-weight="700" fill="#0868E0">947</text>

  <rect x="305" y="100" width="210" height="70" rx="8" fill="#FFF" filter="url(#shadow2)"/>
  <text x="325" y="123" font-size="11" fill="#8895A5">Avg Price / Night</text>
  <text x="325" y="153" font-size="28" font-weight="700" fill="#F39C12">2,450 EGP</text>

  <rect x="530" y="100" width="210" height="70" rx="8" fill="#FFF" filter="url(#shadow2)"/>
  <text x="550" y="123" font-size="11" fill="#8895A5">Avg Rating</text>
  <text x="550" y="153" font-size="28" font-weight="700" fill="#2ECC71">4.3</text>

  <rect x="755" y="100" width="200" height="70" rx="8" fill="#FFF" filter="url(#shadow2)"/>
  <text x="775" y="123" font-size="11" fill="#8895A5">Top Value Hotel</text>
  <text x="775" y="148" font-size="13" font-weight="700" fill="#9B59B6">Best View Pyramids</text>

  <!-- Scatter Plot: Price vs Rating -->
  <rect x="80" y="185" width="560" height="280" rx="8" fill="#FFF" filter="url(#shadow2)"/>
  <text x="100" y="210" font-size="13" font-weight="600" fill="#18212B">Price vs Weighted Score (bubble size = amenities, color = tier)</text>

  <!-- Axes -->
  <line x1="110" y1="440" x2="620" y2="440" stroke="#D0D8E0" stroke-width="1.5"/>
  <line x1="110" y1="230" x2="110" y2="440" stroke="#D0D8E0" stroke-width="1.5"/>
  <text x="360" y="465" text-anchor="middle" font-size="10" fill="#8895A5">Price per Night (EGP)</text>
  <text x="90" y="335" text-anchor="middle" font-size="10" fill="#8895A5" transform="rotate(-90, 90, 335)">Weighted Score</text>

  <!-- Grid lines -->
  <line x1="110" y1="270" x2="620" y2="270" stroke="#EBF0F5" stroke-width="1"/>
  <line x1="110" y1="325" x2="620" y2="325" stroke="#EBF0F5" stroke-width="1"/>
  <line x1="110" y1="382" x2="620" y2="382" stroke="#EBF0F5" stroke-width="1"/>
  <line x1="238" y1="230" x2="238" y2="440" stroke="#EBF0F5" stroke-width="1"/>
  <line x1="366" y1="230" x2="366" y2="440" stroke="#EBF0F5" stroke-width="1"/>
  <line x1="494" y1="230" x2="494" y2="440" stroke="#EBF0F5" stroke-width="1"/>

  <!-- Scatter points (color by tier) -->
  <!-- Budget (green) -->
  <circle cx="150" cy="400" r="6" fill="#2ECC71" opacity="0.7"/>
  <circle cx="170" cy="380" r="5" fill="#2ECC71" opacity="0.7"/>
  <circle cx="145" cy="395" r="7" fill="#2ECC71" opacity="0.7"/>
  <circle cx="185" cy="410" r="4" fill="#2ECC71" opacity="0.7"/>
  <circle cx="160" cy="375" r="8" fill="#2ECC71" opacity="0.7"/>

  <!-- Mid-range (blue) -->
  <circle cx="240" cy="340" r="9" fill="#3498DB" opacity="0.7"/>
  <circle cx="280" cy="320" r="7" fill="#3498DB" opacity="0.7"/>
  <circle cx="220" cy="360" r="6" fill="#3498DB" opacity="0.7"/>
  <circle cx="300" cy="310" r="10" fill="#3498DB" opacity="0.7"/>
  <circle cx="260" cy="335" r="8" fill="#3498DB" opacity="0.7"/>

  <!-- Upper-mid (amber) -->
  <circle cx="380" cy="290" r="12" fill="#F39C12" opacity="0.7"/>
  <circle cx="420" cy="270" r="10" fill="#F39C12" opacity="0.7"/>
  <circle cx="350" cy="305" r="9" fill="#F39C12" opacity="0.7"/>
  <circle cx="400" cy="285" r="11" fill="#F39C12" opacity="0.7"/>

  <!-- Luxury (red) -->
  <circle cx="520" cy="255" r="14" fill="#E74C3C" opacity="0.7"/>
  <circle cx="570" cy="245" r="12" fill="#E74C3C" opacity="0.7"/>
  <circle cx="480" cy="270" r="13" fill="#E74C3C" opacity="0.7"/>
  <circle cx="550" cy="250" r="15" fill="#E74C3C" opacity="0.7"/>

  <!-- Legend -->
  <rect x="490" y="220" width="10" height="10" rx="2" fill="#2ECC71" opacity="0.7"/>
  <text x="506" y="230" font-size="9" fill="#8895A5">Budget</text>
  <rect x="490" y="235" width="10" height="10" rx="2" fill="#3498DB" opacity="0.7"/>
  <text x="506" y="245" font-size="9" fill="#8895A5">Mid-range</text>
  <rect x="540" y="220" width="10" height="10" rx="2" fill="#F39C12" opacity="0.7"/>
  <text x="556" y="230" font-size="9" fill="#8895A5">Upper-mid</text>
  <rect x="540" y="235" width="10" height="10" rx="2" fill="#E74C3C" opacity="0.7"/>
  <text x="556" y="245" font-size="9" fill="#8895A5">Luxury</text>

  <!-- Pie chart: Price tier distribution -->
  <rect x="655" y="185" width="300" height="130" rx="8" fill="#FFF" filter="url(#shadow2)"/>
  <text x="675" y="210" font-size="13" font-weight="600" fill="#18212B">Price Tier Distribution</text>
  <!-- Pie -->
  <path d="M 750 290 L 750 250 A 40 40 0 0 1 787 278 Z" fill="#2ECC71"/>
  <path d="M 750 290 L 787 278 A 40 40 0 0 1 765 327 Z" fill="#3498DB"/>
  <path d="M 750 290 L 765 327 A 40 40 0 0 1 715 315 Z" fill="#F39C12"/>
  <path d="M 750 290 L 715 315 A 40 40 0 0 1 750 250 Z" fill="#E74C3C"/>
  <text x="810" y="260" font-size="9" fill="#2ECC71">● Budget 35%</text>
  <text x="810" y="275" font-size="9" fill="#3498DB">● Mid-range 30%</text>
  <text x="810" y="290" font-size="9" fill="#F39C12">● Upper-mid 20%</text>
  <text x="810" y="305" font-size="9" fill="#E74C3C">● Luxury 15%</text>

  <!-- Bar: Avg price by city -->
  <rect x="655" y="325" width="300" height="140" rx="8" fill="#FFF" filter="url(#shadow2)"/>
  <text x="675" y="350" font-size="13" font-weight="600" fill="#18212B">Avg Price / Night by City</text>
  <rect x="675" y="360" width="180" height="14" rx="3" fill="#0868E0" opacity="0.9"/>
  <text x="865" y="372" font-size="9" fill="#5A6B7A">3200</text>
  <text x="675" y="376" font-size="9" fill="#5A6B7A">Luxor</text>
  <rect x="675" y="385" width="140" height="14" rx="3" fill="#0868E0" opacity="0.8"/>
  <text x="825" y="397" font-size="9" fill="#5A6B7A">2500</text>
  <text x="675" y="401" font-size="9" fill="#5A6B7A">Sharm El Sheikh</text>
  <rect x="675" y="410" width="110" height="14" rx="3" fill="#0868E0" opacity="0.7"/>
  <text x="795" y="422" font-size="9" fill="#5A6B7A">2000</text>
  <text x="675" y="426" font-size="9" fill="#5A6B7A">Cairo</text>
  <rect x="675" y="435" width="80" height="14" rx="3" fill="#0868E0" opacity="0.6"/>
  <text x="765" y="447" font-size="9" fill="#5A6B7A">1500</text>
  <text x="675" y="451" font-size="9" fill="#5A6B7A">Alexandria</text>

  <!-- Data table preview -->
  <rect x="80" y="480" width="875" height="100" rx="8" fill="#FFF" filter="url(#shadow2)"/>
  <text x="100" y="500" font-size="12" font-weight="600" fill="#18212B">📋 Top 10 Hotels by Value Score</text>
  <line x1="100" y1="505" x2="935" y2="505" stroke="#EBF0F5" stroke-width="1"/>
  <text x="100" y="520" font-size="9" font-weight="600" fill="#8895A5">Hotel Name</text>
  <text x="350" y="520" font-size="9" font-weight="600" fill="#8895A5">City</text>
  <text x="500" y="520" font-size="9" font-weight="600" fill="#8895A5">Price</text>
  <text x="600" y="520" font-size="9" font-weight="600" fill="#8895A5">Rating</text>
  <text x="700" y="520" font-size="9" font-weight="600" fill="#8895A5">Value Score</text>
  <text x="830" y="520" font-size="9" font-weight="600" fill="#8895A5">Tier</text>
  <text x="100" y="538" font-size="9" fill="#18212B">Best View Pyramids Hotel</text>
  <text x="350" y="538" font-size="9" fill="#5A6B7A">Giza</text>
  <text x="500" y="538" font-size="9" fill="#5A6B7A">1,200</text>
  <text x="600" y="538" font-size="9" fill="#2ECC71">4.7</text>
  <text x="700" y="538" font-size="9" font-weight="600" fill="#0868E0">3.92</text>
  <text x="830" y="538" font-size="9" fill="#3498DB">Mid-range</text>
  <text x="100" y="555" font-size="9" fill="#18212B">Four Seasons Cairo</text>
  <text x="350" y="555" font-size="9" fill="#5A6B7A">Cairo</text>
  <text x="500" y="555" font-size="9" fill="#5A6B7A">5,500</text>
  <text x="600" y="555" font-size="9" fill="#2ECC71">4.7</text>
  <text x="700" y="555" font-size="9" font-weight="600" fill="#0868E0">0.85</text>
  <text x="830" y="555" font-size="9" fill="#E74C3C">Luxury</text>
  <text x="100" y="572" font-size="9" fill="#18212B">Steigenberger Nile Palace</text>
  <text x="350" y="572" font-size="9" fill="#5A6B7A">Luxor</text>
  <text x="500" y="572" font-size="9" fill="#5A6B7A">2,800</text>
  <text x="600" y="572" font-size="9" fill="#2ECC71">4.6</text>
  <text x="700" y="572" font-size="9" font-weight="600" fill="#0868E0">1.64</text>
  <text x="830" y="572" font-size="9" fill="#F39C12">Upper-mid</text>
</svg>