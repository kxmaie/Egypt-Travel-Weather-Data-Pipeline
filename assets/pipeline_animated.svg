<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0c1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Node Gradients -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192445" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0e172e" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="100%" stop-color="#f7971e" />
    </linearGradient>

    <linearGradient id="nileGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#00c6ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0.05" />
    </linearGradient>

    <style>
      @keyframes dashFlow {
        to {
          stroke-dashoffset: -100;
        }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.4)); }
        50% { transform: scale(1.02); filter: drop-shadow(0 0 22px rgba(0, 242, 254, 0.8)); }
      }
      @keyframes pulseGold {
        0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 210, 0, 0.3)); }
        50% { filter: drop-shadow(0 0 20px rgba(255, 210, 0, 0.7)); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes particleMove {
        0% { offset-distance: 0%; opacity: 0; }
        10% { opacity: 1; }
        90% { opacity: 1; }
        100% { offset-distance: 100%; opacity: 0; }
      }
      .stream-line {
        stroke-dasharray: 10 14;
        animation: dashFlow 2s linear infinite;
      }
      .stream-fast {
        stroke-dasharray: 8 12;
        animation: dashFlow 1.2s linear infinite;
      }
      .floating {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .pulse-gold {
        animation: pulseGold 3s ease-in-out infinite;
      }
      .title-text {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        letter-spacing: 2px;
      }
    </style>
  </defs>

  <!-- Dark Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Grid Tech Lines in Background -->
  <g opacity="0.08" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Futuristic Glowing Nile River Path -->
  <path d="M0,560 Q300,500 600,530 T1200,500 L1200,630 L0,630 Z" fill="url(#nileGrad)" />
  <path d="M0,560 Q300,500 600,530 T1200,500" fill="none" stroke="#00f2fe" stroke-width="2" opacity="0.4" class="stream-line" />

  <!-- Pyramids Silhouette (Cyber Gold Outline) -->
  <g opacity="0.45" transform="translate(680, 390)">
    <!-- Great Pyramid -->
    <polygon points="120,130 190,40 260,130" fill="#080e21" stroke="#e5a93c" stroke-width="2" />
    <line x1="190" y1="40" x2="185" y2="130" stroke="#e5a93c" stroke-width="1.5" opacity="0.7" />
    <!-- Second Pyramid -->
    <polygon points="50,130 110,55 170,130" fill="#060b1a" stroke="#d4952b" stroke-width="1.5" />
    <line x1="110" y1="55" x2="105" y2="130" stroke="#d4952b" stroke-width="1" opacity="0.6" />
    <!-- Third Pyramid -->
    <polygon points="230,130 270,80 310,130" fill="#040814" stroke="#c0821d" stroke-width="1.2" />
  </g>

  <!-- Header Section -->
  <g transform="translate(60, 55)">
    <text x="0" y="0" fill="#ffd200" font-size="14" font-weight="700" letter-spacing="3" font-family="'Segoe UI', sans-serif">ENTERPRISE ELT DATA PIPELINE</text>
    <text x="0" y="32" fill="#ffffff" font-size="30" font-weight="800" class="title-text">EGYPT TRAVEL &amp; WEATHER PLATFORM</text>
    <text x="0" y="55" fill="#7d93b8" font-size="13" font-family="'Segoe UI', sans-serif">8 Cities • 947 Hotels • 1,000+ Restaurants • Real-time Weather &amp; Tourism Insights</text>
  </g>

  <!-- Live Status Badge (Top Right) -->
  <g transform="translate(980, 45)" class="pulse-gold">
    <rect width="160" height="38" rx="19" fill="#13203c" stroke="#00f2fe" stroke-width="1.5" />
    <circle cx="24" cy="19" r="6" fill="#00ff88">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="40" y="24" fill="#00f2fe" font-size="13" font-weight="700" font-family="'Segoe UI', sans-serif">PIPELINE ACTIVE</text>
  </g>

  <!-- ==================== DATA PIPELINE FLOW ==================== -->

  <!-- Animated Connection Streams -->
  <!-- Stream 1: Sources -> SQL Server -->
  <path d="M 230,285 C 310,285 320,285 380,285" fill="none" stroke="url(#cyanLine)" stroke-width="3.5" class="stream-line" filter="url(#glowCyan)" />
  
  <!-- Stream 2: SQL Server -> Snowflake -->
  <path d="M 540,285 C 600,285 610,285 660,285" fill="none" stroke="url(#cyanLine)" stroke-width="3.5" class="stream-fast" filter="url(#glowCyan)" />
  
  <!-- Stream 3: Snowflake -> dbt -->
  <path d="M 800,285 C 840,285 850,285 880,285" fill="none" stroke="url(#goldLine)" stroke-width="3.5" class="stream-line" filter="url(#glowGold)" />

  <!-- Stream 4: dbt -> Dashboard -->
  <path d="M 1000,285 C 1030,285 1035,285 1060,285" fill="none" stroke="url(#cyanLine)" stroke-width="3.5" class="stream-fast" filter="url(#glowCyan)" />


  <!-- ==================== STAGE 1: DATA SOURCES ==================== -->
  <g transform="translate(60, 160)" class="floating">
    <!-- Outer Group Container -->
    <rect width="170" height="250" rx="16" fill="url(#nodeGrad)" stroke="#273966" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))" />
    
    <text x="85" y="32" fill="#ffd200" font-size="12" font-weight="800" text-anchor="middle" font-family="'Segoe UI', sans-serif">RAW SOURCES</text>
    <line x1="20" y1="44" x2="150" y2="44" stroke="#25355c" stroke-width="1" />

    <!-- Source 1: Open-Meteo -->
    <g transform="translate(15, 58)">
      <rect width="140" height="38" rx="8" fill="#101932" stroke="#00f2fe" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">🌤️ Open-Meteo</text>
    </g>

    <!-- Source 2: TomTom API -->
    <g transform="translate(15, 104)">
      <rect width="140" height="38" rx="8" fill="#101932" stroke="#ff7675" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">📍 TomTom API</text>
    </g>

    <!-- Source 3: Hotels CSV -->
    <g transform="translate(15, 150)">
      <rect width="140" height="38" rx="8" fill="#101932" stroke="#a29bfe" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">🏨 Hotels (947)</text>
    </g>

    <!-- Source 4: Restaurants CSV -->
    <g transform="translate(15, 196)">
      <rect width="140" height="38" rx="8" fill="#101932" stroke="#00b894" stroke-width="1" />
      <text x="14" y="24" fill="#ffffff" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">🍽️ Dining (~1k)</text>
    </g>
  </g>


  <!-- ==================== STAGE 2: AIRFLOW & SQL SERVER ==================== -->
  <g transform="translate(380, 155)">
    <!-- Main Node Box -->
    <rect width="160" height="260" rx="18" fill="url(#nodeGrad)" stroke="#00f2fe" stroke-width="2" filter="drop-shadow(0 0 18px rgba(0,242,254,0.25))" />
    
    <!-- Badge -->
    <rect x="25" y="14" width="110" height="22" rx="11" fill="#0052cc" opacity="0.6" />
    <text x="80" y="29" fill="#00f2fe" font-size="11" font-weight="800" text-anchor="middle" font-family="'Segoe UI', sans-serif">AIRFLOW DAGs</text>

    <text x="80" y="62" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle" font-family="'Segoe UI', sans-serif">SQL Server</text>
    <text x="80" y="80" fill="#7d93b8" font-size="11" text-anchor="middle" font-family="'Segoe UI', sans-serif">Bronze &amp; Silver Staging</text>

    <!-- Bronze Layer Card -->
    <g transform="translate(15, 96)">
      <rect width="130" height="60" rx="10" fill="#181313" stroke="#cd7f32" stroke-width="1.8" />
      <text x="12" y="24" fill="#cd7f32" font-size="12" font-weight="800" font-family="'Segoe UI', sans-serif">🟫 Bronze Layer</text>
      <text x="12" y="44" fill="#999999" font-size="10" font-family="'Segoe UI', sans-serif">Raw Data Snapshots</text>
    </g>

    <!-- Silver Layer Card -->
    <g transform="translate(15, 168)">
      <rect width="130" height="68" rx="10" fill="#151b29" stroke="#bdc3c7" stroke-width="1.8" />
      <text x="12" y="24" fill="#ecf0f1" font-size="12" font-weight="800" font-family="'Segoe UI', sans-serif">⬜ Silver Layer</text>
      <text x="12" y="44" fill="#7f8c8d" font-size="10" font-family="'Segoe UI', sans-serif">Deduplication &amp; Types</text>
      <text x="12" y="58" fill="#00ff88" font-size="9" font-weight="700" font-family="'Segoe UI', sans-serif">Daily • Hourly • Current</text>
    </g>
  </g>


  <!-- ==================== STAGE 3: SNOWFLAKE WAREHOUSE ==================== -->
  <g transform="translate(660, 175)" class="floating" style="animation-delay: -1.5s;">
    <!-- Snowflake Container -->
    <rect width="140" height="220" rx="18" fill="url(#nodeGrad)" stroke="#29b5e8" stroke-width="2.2" filter="drop-shadow(0 0 20px rgba(41,181,232,0.3))" />
    
    <!-- Snowflake Icon / Graphic -->
    <g transform="translate(70, 60)">
      <circle cx="0" cy="0" r="28" fill="#122744" stroke="#29b5e8" stroke-width="1.5" />
      <text x="0" y="8" fill="#29b5e8" font-size="24" text-anchor="middle">❄️</text>
    </g>

    <text x="70" y="115" fill="#ffffff" font-size="16" font-weight="800" text-anchor="middle" font-family="'Segoe UI', sans-serif">Snowflake</text>
    <text x="70" y="132" fill="#29b5e8" font-size="11" font-weight="600" text-anchor="middle" font-family="'Segoe UI', sans-serif">Cloud Data Warehouse</text>

    <!-- Details Box -->
    <g transform="translate(15, 148)">
      <rect width="110" height="52" rx="8" fill="#0b172e" />
      <text x="55" y="22" fill="#88b5dd" font-size="10" text-anchor="middle" font-family="'Segoe UI', sans-serif">Schema: RAW_DATA</text>
      <text x="55" y="38" fill="#00ff88" font-size="10" font-weight="700" text-anchor="middle" font-family="'Segoe UI', sans-serif">write_pandas Batch</text>
    </g>
  </g>


  <!-- ==================== STAGE 4: DBT MODELING ==================== -->
  <g transform="translate(880, 185)">
    <!-- dbt Container -->
    <rect width="120" height="200" rx="16" fill="url(#nodeGrad)" stroke="#ff694b" stroke-width="2" filter="drop-shadow(0 0 16px rgba(255,105,75,0.25))" />
    
    <text x="60" y="34" fill="#ff694b" font-size="20" font-weight="900" text-anchor="middle" font-family="'Segoe UI', sans-serif">dbt</text>
    <text x="60" y="52" fill="#7d93b8" font-size="11" text-anchor="middle" font-family="'Segoe UI', sans-serif">Transformation</text>

    <line x1="15" y1="64" x2="105" y2="64" stroke="#312229" stroke-width="1" />

    <g transform="translate(12, 75)">
      <rect width="96" height="42" rx="6" fill="#1b1722" stroke="#ff7675" stroke-width="1" />
      <text x="48" y="20" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle" font-family="'Segoe UI', sans-serif">🥈 Staging</text>
      <text x="48" y="34" fill="#a0a0a0" font-size="9" text-anchor="middle" font-family="'Segoe UI', sans-serif">6 Silver Models</text>
    </g>

    <g transform="translate(12, 128)">
      <rect width="96" height="52" rx="6" fill="#201c15" stroke="#ffd200" stroke-width="1.2" />
      <text x="48" y="20" fill="#ffd200" font-size="10" font-weight="700" text-anchor="middle" font-family="'Segoe UI', sans-serif">🥇 Gold Marts</text>
      <text x="48" y="34" fill="#ffffff" font-size="9" text-anchor="middle" font-family="'Segoe UI', sans-serif">Tourism Index</text>
      <text x="48" y="45" fill="#a0a0a0" font-size="8" text-anchor="middle" font-family="'Segoe UI', sans-serif">Hotel &amp; City Marts</text>
    </g>
  </g>


  <!-- ==================== STAGE 5: STREAMLIT DASHBOARD ==================== -->
  <g transform="translate(1060, 160)" class="floating" style="animation-delay: -3s;">
    <!-- Dashboard Container -->
    <rect width="100" height="250" rx="16" fill="url(#nodeGrad)" stroke="#00ff88" stroke-width="2" filter="drop-shadow(0 0 18px rgba(0,255,136,0.3))" />
    
    <text x="50" y="32" fill="#00ff88" font-size="12" font-weight="800" text-anchor="middle" font-family="'Segoe UI', sans-serif">STREAMLIT</text>
    <text x="50" y="50" fill="#ffffff" font-size="14" font-weight="700" text-anchor="middle" font-family="'Segoe UI', sans-serif">App</text>

    <!-- Mini Charts -->
    <g transform="translate(15, 68)">
      <!-- Mini Bar Chart -->
      <rect width="70" height="65" rx="6" fill="#0d1f22" stroke="#00ff88" stroke-width="0.8" />
      <rect x="10" y="40" width="8" height="18" fill="#00f2fe" />
      <rect x="22" y="25" width="8" height="33" fill="#ffd200" />
      <rect x="34" y="15" width="8" height="43" fill="#00ff88" />
      <rect x="46" y="30" width="8" height="28" fill="#ff7675" />
      <text x="35" y="76" fill="#a8e6cf" font-size="8" text-anchor="middle" font-family="'Segoe UI', sans-serif">4 Live Pages</text>
    </g>

    <!-- KPIs Pill -->
    <g transform="translate(12, 160)">
      <rect width="76" height="32" rx="6" fill="#142621" />
      <text x="38" y="16" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle" font-family="'Segoe UI', sans-serif">Score: 0-100</text>
      <text x="38" y="27" fill="#00ff88" font-size="8" text-anchor="middle" font-family="'Segoe UI', sans-serif">Tourism Index</text>
    </g>

    <g transform="translate(12, 200)">
      <rect width="76" height="32" rx="6" fill="#142621" />
      <text x="38" y="16" fill="#ffffff" font-size="9" font-weight="700" text-anchor="middle" font-family="'Segoe UI', sans-serif">Value Score</text>
      <text x="38" y="27" fill="#ffd200" font-size="8" text-anchor="middle" font-family="'Segoe UI', sans-serif">Hotel Pricing</text>
    </g>
  </g>


  <!-- Bottom Footer Tech Badges -->
  <g transform="translate(60, 580)">
    <text x="0" y="0" fill="#586c91" font-size="12" font-family="'Segoe UI', sans-serif">TECH STACK:</text>
    <text x="90" y="0" fill="#88b5dd" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Apache Airflow • SQL Server • Snowflake • dbt Core • Streamlit • Python • GitHub Actions CI/CD</text>
  </g>
</svg>
